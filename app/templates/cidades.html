{% extends 'base.html' %}

{% block title %}Cidades - Sistema de Gestão{% endblock %}

{% block content %}
    <h2 class="mb-4">Cidades</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nome</th>
                <th>UF</th>
            </tr>
        </thead>
        <tbody>
            {% for cidade in cidades %}
                <tr>
                    <td>{{ cidade.nome }}</td>
                    <td>{{ cidade.uf.sigla }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2" class="text-center">Nenhuma cidade cadastrada.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
